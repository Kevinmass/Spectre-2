# Docker Compose configuration for Semantic Document Search Engine
version: '3.8'

services:
  backend:
    build: ../core-engine
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    environment:
      - ENVIRONMENT=production
    restart: unless-stopped

  vector_db:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ../data/vector_index:/qdrant/storage
    restart: unless-stopped

  frontend:
    build: ../desktop-app
    ports:
      - "3000:3000"
    volumes:
      - ../data:/app/data
    depends_on:
      - backend
    restart: unless-stopped