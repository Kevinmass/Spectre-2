<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spectre — Fallos de la CSJN</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="cabecera">
    <h1>Spectre</h1>
    <nav class="tabs" aria-label="Secciones">
      <button type="button" class="tab" data-tab="buscar" aria-current="true">Buscar</button>
      <button type="button" class="tab" data-tab="biblioteca">Biblioteca</button>
    </nav>
  </header>

  <main>
    <section id="tab-buscar" class="panel">
      <form id="form-buscar" class="buscador">
        <input
          type="search"
          id="campo-consulta"
          name="q"
          placeholder="Buscar en los fallos…"
          autocomplete="off"
          disabled
        />
        <button type="submit" disabled>Buscar</button>
      </form>

      <div id="filtros" class="filtros">
        <label>
          Tribunal de origen
          <input type="text" id="filtro-tribunal" autocomplete="off" placeholder="nombre exacto" />
        </label>
        <label>
          Sección
          <select id="filtro-seccion">
            <option value="">todas</option>
            <option value="mayoria">mayoría</option>
            <option value="voto">voto</option>
            <option value="disidencia">disidencia</option>
            <option value="dictamen">dictamen</option>
          </select>
        </label>
        <label>
          Año desde
          <input type="number" id="filtro-anio-desde" min="1863" max="2100" step="1" />
        </label>
        <label>
          Año hasta
          <input type="number" id="filtro-anio-hasta" min="1863" max="2100" step="1" />
        </label>
        <label class="filtro-check">
          <input type="checkbox" id="filtro-solo-lexico" />
          Solo texto, sin buscar por significado
        </label>
        <button type="button" id="filtros-limpiar" class="filtros-limpiar">Limpiar filtros</button>
      </div>

      <p id="buscar-aviso" class="vacio">Cargando…</p>
      <ol id="resultados" class="resultados"></ol>
    </section>

    <section id="tab-biblioteca" class="panel" hidden>
      <p id="biblioteca-vacio" class="vacio" hidden>Todavía no cargaste ningún tomo.</p>
      <table id="biblioteca-tabla" hidden>
        <thead>
          <tr><th>Tomo</th><th>Estado</th><th>Calidad</th><th>Progreso</th></tr>
        </thead>
        <tbody id="biblioteca-filas"></tbody>
      </table>

      <div class="acciones-biblioteca">
        <form id="form-indexar-csjn" class="form-tomo">
          <h3>Indexar desde la CSJN</h3>
          <label>
            Número de tomo
            <input type="number" name="numero" min="1" required />
          </label>
          <label>
            Id de la CSJN
            <input
              type="text"
              name="csjn_tomo_id"
              required
              placeholder="p. ej. 445 — lo da `spectre csjn catalog`"
            />
          </label>
          <p class="ayuda-form">
            No es el número de tomo: es un id interno del sitio de la Corte.
            Si ya tenés el PDF, usá «Subir un PDF propio».
          </p>
          <button type="submit">Indexar</button>
        </form>

        <form id="form-subir-pdf" class="form-tomo">
          <h3>Subir un PDF propio</h3>
          <label>
            Número de tomo
            <input type="number" name="numero" min="1" required />
          </label>
          <label>
            Archivo PDF
            <input type="file" name="archivo" accept="application/pdf" required />
          </label>
          <button type="submit">Subir e indexar</button>
        </form>
      </div>
      <p id="biblioteca-aviso" class="vacio" hidden></p>
    </section>

    <section id="tab-fallo" class="panel" hidden>
      <button type="button" id="volver-resultados" class="volver">← Volver a los resultados</button>
      <article id="fallo-contenido"></article>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
