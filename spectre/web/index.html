<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spectre — Fallos de la CSJN</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="cabecera">
    <h1>Spectre</h1>
    <nav class="tabs" aria-label="Secciones">
      <button type="button" class="tab" data-tab="buscar" aria-current="true">Buscar</button>
      <button type="button" class="tab" data-tab="biblioteca">Biblioteca</button>
    </nav>
  </header>

  <main>
    <section id="tab-buscar" class="panel">
      <form id="form-buscar" class="buscador">
        <input
          type="search"
          id="campo-consulta"
          name="q"
          placeholder="Buscar en los fallos…"
          autocomplete="off"
          disabled
        />
        <button type="submit" disabled>Buscar</button>
      </form>
      <p id="buscar-aviso" class="vacio">Cargando…</p>
      <ol id="resultados" class="resultados"></ol>
    </section>

    <section id="tab-biblioteca" class="panel" hidden>
      <p id="biblioteca-vacio" class="vacio" hidden>Todavía no cargaste ningún tomo.</p>
      <table id="biblioteca-tabla" hidden>
        <thead>
          <tr><th>Tomo</th><th>Estado</th><th>Calidad</th></tr>
        </thead>
        <tbody id="biblioteca-filas"></tbody>
      </table>
    </section>

    <section id="tab-fallo" class="panel" hidden>
      <button type="button" id="volver-resultados" class="volver">← Volver a los resultados</button>
      <article id="fallo-contenido"></article>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
