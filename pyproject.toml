[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectre"
version = "0.0.0"
description = "Motor de búsqueda semántica sobre jurisprudencia argentina (Fallos de la CSJN)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kevin" }]
dependencies = [
    "pydantic-settings>=2.4",
    "pdfplumber>=0.11",
    # Índice vectorial embebido (D-5). Arrastra pyarrow + numpy, no torch:
    # moderado y es el almacenamiento elegido, así que va como dep dura.
    "lancedb>=0.13,<1.0",
    # Servidor de la interfaz (D-11, PR-20). Un solo proceso, sin Docker.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Subida manual de PDFs desde la Biblioteca (D-9, PR-23): FastAPI necesita
    # este paquete para parsear formularios multipart (`UploadFile`).
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # TestClient de FastAPI (PR-20) lo necesita para hacer requests in-process.
    "httpx>=0.27",
]
# Embeddings locales (PR-12). Arrastra torch: pesado y no hace falta para
# parsear ni segmentar, así que va aparte. CI no lo instala; para correr
# `pytest -m slow` de embed o `spectre embed probe`: pip install -e ".[embed]".
embed = [
    "sentence-transformers>=3.0",
]

[project.scripts]
spectre = "spectre.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["spectre"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` se excluye por defecto: hoy es la medición de aceptación sobre el Tomo
# 348 completo (~2 min, y necesita data/tomos/348.pdf). Correrla: `pytest -m slow`.
# `red` también: pega contra el sitio real de la CSJN (PR-16); CI no tiene por
# qué depender de que ese sitio esté arriba. Correrla: `pytest -m red`.
addopts = "-ra -m 'not slow and not red'"
markers = [
    "slow: medición sobre un fixture grande no versionado; fuera del run por defecto",
    "red: pega contra un sitio real por HTTP; fuera del run por defecto",
]
