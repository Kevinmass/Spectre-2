[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectre"
version = "0.0.0"
description = "Motor de búsqueda semántica sobre jurisprudencia argentina (Fallos de la CSJN)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kevin" }]
dependencies = [
    "pydantic-settings>=2.4",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
spectre = "spectre.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["spectre"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` se excluye por defecto: hoy es la medición de aceptación sobre el Tomo
# 348 completo (~2 min, y necesita data/tomos/348.pdf). Correrla: `pytest -m slow`.
addopts = "-ra -m 'not slow'"
markers = [
    "slow: medición sobre un fixture grande no versionado; fuera del run por defecto",
]
