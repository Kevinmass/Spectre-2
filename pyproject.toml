[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectre"
version = "0.0.0"
description = "Motor de búsqueda semántica sobre jurisprudencia argentina (Fallos de la CSJN)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kevin" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

# El script de consola `spectre` se declara en PR-01, junto con la CLI real.

[tool.hatch.build.targets.wheel]
packages = ["spectre"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
